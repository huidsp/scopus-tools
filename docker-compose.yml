services:
  scopus-tools:
    image: ghcr.io/huidsp/scopus-tools:main
    container_name: scopus-tools
    ports:
      - "7860:7860"
    env_file:
      - .env
    volumes:
      # プロジェクト JSON の永続化
      - ./projects:/data/projects
      # WoS 収録誌リスト(SCIE/SSCI/AHCI/ESCI)の CSV を index/ に置く。
      # コンテナ内の /data/index を起動時に読み込み、論文に収録区分を付与する(読み取り専用)。
      - ./index:/data/index:ro
    restart: unless-stopped
