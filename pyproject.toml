[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scopus_tools"
version = "0.9.1"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
mcp = ["mcp>=1.2"]

[project.scripts]
scopus-tools = "scopus_tools.cli:main"

[tool.setuptools.packages.find]
where = ["."]
